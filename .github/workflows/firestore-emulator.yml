name: Firestore Emulator Security Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'Apna_Basket_V12_Firestore_Rules.rules'
      - 'test/**'
      - 'functions/**'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/firestore-emulator.yml'
  push:
    branches: [security/emulator-18-rules]

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm install
      - name: Run Firestore Emulator tests
        run: npm run test:rules

  functions-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Compile Functions TypeScript
        run: npm --prefix functions run build
      - name: Run Functions security unit tests
        run: npm --prefix functions test
      - name: Run callable handler integration tests with Firestore Emulator
        run: npm run test:functions:emulator
