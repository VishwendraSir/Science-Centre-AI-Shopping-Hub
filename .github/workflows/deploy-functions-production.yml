name: Deploy Apna Basket Functions (Production)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_FUNCTIONS to confirm production Functions deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    if: ${{ inputs.confirmation == 'DEPLOY_FUNCTIONS' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: security/emulator-18-rules

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Build and deploy Functions only
        run: |
          cd functions
          npm ci
          npm run build
          cd ..
          firebase deploy --only functions --project apna-basket-3433e --non-interactive
